name: Check branch name

on:
  pull_request:
    branches:
      - production
      - staging

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ ! "$BRANCH" =~ ^(feature|fix|hotfix|chore|release|claude)/.+$ ]] && [[ "$BRANCH" != "staging" ]] && [[ "$BRANCH" != "production" ]]; then
            echo "Branch name '$BRANCH' must start with feature/, fix/, hotfix/, chore/, release/, or claude/ (or be 'staging' or 'production')"
            exit 1
          fi
